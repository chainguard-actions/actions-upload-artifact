name: Test upload with hidden files included
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create files including hidden files
        run: |
          mkdir -p /tmp/hidden-test
          echo "visible file" > /tmp/hidden-test/visible.txt
          echo "hidden file" > /tmp/hidden-test/.hidden-file
          ls -la /tmp/hidden-test/

      - id: upload
        uses: .
        with:
          name: hidden-files-artifact
          path: /tmp/hidden-test/
          include-hidden-files: 'true'
        continue-on-error: true

      - name: Assert upload ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: upload with hidden files succeeded, artifact-id='$ARTIFACT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: upload failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
