name: Test include-hidden-files option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with hidden files
        run: |
          mkdir -p /tmp/test-hidden-files
          echo "visible content" > /tmp/test-hidden-files/visible.txt
          echo "hidden content" > /tmp/test-hidden-files/.hidden-file
          echo "hidden dir content" > /tmp/test-hidden-files/.hidden-dir-file

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-hidden-files-artifact
          path: /tmp/test-hidden-files/
          include-hidden-files: 'true'

      - name: Assert action ran with include-hidden-files=true
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          # The action must have run (success or failure due to API unavailability)
          if [ "$OUTCOME" = "success" ]; then
            echo "Upload succeeded with include-hidden-files=true"
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: artifact-id is empty on success"
              exit 1
            fi
            echo "PASS: artifact uploaded successfully with hidden files included"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but upload failed (artifact API not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
