name: Test include-hidden-files option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with hidden and regular files
        run: |
          mkdir -p /tmp/hidden-files-test
          echo "regular file content" > /tmp/hidden-files-test/regular.txt
          echo "hidden file content" > /tmp/hidden-files-test/.hidden-file

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-artifact-with-hidden
          path: /tmp/hidden-files-test/
          include-hidden-files: 'true'

      - name: Assert action ran (upload succeeded or failed gracefully on sentinel env)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: artifact upload with hidden files succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in sentinel/act environment without artifact backend)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
