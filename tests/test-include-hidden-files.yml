name: Test upload with hidden files included
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory with hidden and visible files
        run: |
          mkdir -p /tmp/hidden-files-test
          echo "visible content" > /tmp/hidden-files-test/visible.txt
          echo "hidden content" > /tmp/hidden-files-test/.hidden-file
          echo "hidden dir content" > /tmp/hidden-files-test/.hidden-dir-file

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: hidden-files-artifact
          path: /tmp/hidden-files-test/
          include-hidden-files: 'true'

      - name: Assert action ran (upload succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: upload with hidden files succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
