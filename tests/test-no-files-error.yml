name: Test upload-artifact - no files found with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          name: test-artifact
          path: /tmp/nonexistent-path-that-does-not-exist/**
          if-no-files-found: error
        continue-on-error: true
      - name: Assert action failed when no files found and if-no-files-found=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no files found and if-no-files-found=error, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no files found and if-no-files-found=error"
