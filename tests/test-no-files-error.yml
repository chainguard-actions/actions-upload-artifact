name: Test if-no-files-found error behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-artifact-no-files
          path: /tmp/nonexistent-path-that-does-not-exist/*.txt
          if-no-files-found: error

      - name: Assert action failed when no files found with error mode
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no files found and if-no-files-found=error"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no files found with if-no-files-found=error"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
