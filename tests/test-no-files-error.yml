name: Test no files found with error behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: error-artifact
          path: /tmp/nonexistent-path-that-does-not-exist/**
          if-no-files-found: error

      - name: Assert action failed (error mode should fail when no files found)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed in error mode when no files found"
          else
            echo "FAIL: expected failure in error mode but got '$OUTCOME'"
            exit 1
          fi
