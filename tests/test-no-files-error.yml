name: Test no files found with error behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upload
        uses: .
        with:
          name: error-artifact
          path: /tmp/nonexistent-path-that-does-not-exist/**
          if-no-files-found: error
        continue-on-error: true

      - name: Assert action failed (error should cause failure when no files found)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when if-no-files-found=error and no files found, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with if-no-files-found=error"
