name: Test compression-level option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file for compression test
        run: |
          mkdir -p /tmp/test-compression
          # Create a larger file to make compression meaningful
          python3 -c "print('A' * 10000)" > /tmp/test-compression/large-file.txt

      - id: upload-no-compression
        uses: .
        continue-on-error: true
        with:
          name: test-compression-level-0
          path: /tmp/test-compression/large-file.txt
          compression-level: '0'

      - name: Assert action ran with compression-level=0
        env:
          OUTCOME: ${{ steps.upload-no-compression.outcome }}
          ARTIFACT_ID: ${{ steps.upload-no-compression.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          # The action must have run (success or failure due to API unavailability)
          if [ "$OUTCOME" = "success" ]; then
            echo "Upload succeeded with compression-level=0"
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: artifact-id is empty on success"
              exit 1
            fi
            echo "PASS: artifact uploaded successfully with compression-level=0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but upload failed (artifact API not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Create test file for high compression test
        run: |
          python3 -c "print('B' * 10000)" > /tmp/test-compression/large-file-9.txt

      - id: upload-max-compression
        uses: .
        continue-on-error: true
        with:
          name: test-compression-level-9
          path: /tmp/test-compression/large-file-9.txt
          compression-level: '9'

      - name: Assert action ran with compression-level=9
        env:
          OUTCOME: ${{ steps.upload-max-compression.outcome }}
          ARTIFACT_ID: ${{ steps.upload-max-compression.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "Upload succeeded with compression-level=9"
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: artifact-id is empty on success"
              exit 1
            fi
            echo "PASS: artifact uploaded successfully with compression-level=9"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but upload failed (artifact API not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
