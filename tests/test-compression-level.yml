name: Test upload with compression level 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file to upload
        run: |
          mkdir -p /tmp/compression-test
          # Create a file with repetitive content that would normally compress well
          python3 -c "print('A' * 10000)" > /tmp/compression-test/large.txt

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: compression-level-0-artifact
          path: /tmp/compression-test/large.txt
          compression-level: '0'

      - name: Assert action ran and outputs are consistent
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: upload succeeded but artifact-id is empty"
              exit 1
            fi
            if [ -z "$ARTIFACT_URL" ]; then
              echo "FAIL: upload succeeded but artifact-url is empty"
              exit 1
            fi
            echo "PASS: artifact uploaded with compression-level=0, id=$ARTIFACT_ID"
          else
            echo "INFO: upload step did not succeed (outcome=$OUTCOME) — artifact API may not be available under act"
            echo "PASS: action ran without crashing the workflow"
          fi
