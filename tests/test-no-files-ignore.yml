name: Test if-no-files-found ignore behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-artifact-ignore
          path: /tmp/nonexistent-path-that-does-not-exist/*.txt
          if-no-files-found: ignore

      - name: Assert action succeeded when no files found with ignore mode
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action correctly ignored missing files and did not fail"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not have failed when if-no-files-found=ignore"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
