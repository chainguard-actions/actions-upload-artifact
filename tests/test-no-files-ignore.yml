name: Test if-no-files-found ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure the path does not exist
        run: |
          rm -rf /tmp/nonexistent-upload-path

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: no-files-ignore-artifact
          path: /tmp/nonexistent-upload-path/*.txt
          if-no-files-found: ignore

      - name: Assert action did not fail and outputs are empty
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: '$ARTIFACT_ID'"
          echo "artifact-url: '$ARTIFACT_URL'"
          # In ignore mode with no files, the action should succeed (not fail)
          # and outputs should be empty
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail in ignore mode when no files are found"
            exit 1
          fi
          if [ -n "$ARTIFACT_ID" ]; then
            echo "FAIL: artifact-id should be empty when no files are found"
            exit 1
          fi
          echo "PASS: action completed without failure in ignore mode, outputs are empty"
