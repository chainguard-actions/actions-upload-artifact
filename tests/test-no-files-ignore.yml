name: Test no files found with ignore behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upload
        uses: .
        with:
          name: ignore-artifact
          path: /tmp/nonexistent-path-that-does-not-exist/**
          if-no-files-found: ignore

      - name: Assert action did not fail (ignore mode should not fail)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed without failure in ignore mode"
          else
            echo "FAIL: expected success (ignore) but got '$OUTCOME'"
            exit 1
          fi
