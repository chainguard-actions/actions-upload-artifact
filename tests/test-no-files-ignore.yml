name: Test if-no-files-found ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-artifact-ignore
          path: /tmp/nonexistent-path-that-does-not-exist/**
          if-no-files-found: ignore

      - name: Assert action did not hard-fail with ignore mode
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With if-no-files-found=ignore, the action should either succeed (silently)
          # or fail gracefully due to artifact service unavailability under act.
          # It must NOT be skipped.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (ignore mode does not fail on missing files)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
