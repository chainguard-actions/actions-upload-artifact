name: Test if-no-files-found ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upload
        uses: .
        with:
          name: no-files-artifact
          path: /tmp/nonexistent-path-that-does-not-exist/**
          if-no-files-found: ignore

      - name: Assert action did not fail when no files found with ignore mode
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (ignore mode) but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action succeeded with ignore mode when no files found"
