name: Test upload directory artifact
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with multiple files
        run: |
          mkdir -p /tmp/dir-upload-test
          echo "file one content" > /tmp/dir-upload-test/file1.txt
          echo "file two content" > /tmp/dir-upload-test/file2.txt
          echo "file three content" > /tmp/dir-upload-test/file3.txt

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: directory-test-artifact
          path: /tmp/dir-upload-test/

      - name: Assert action ran and outputs are consistent
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: upload succeeded but artifact-id is empty"
              exit 1
            fi
            if [ -z "$ARTIFACT_URL" ]; then
              echo "FAIL: upload succeeded but artifact-url is empty"
              exit 1
            fi
            echo "PASS: directory artifact uploaded successfully, id=$ARTIFACT_ID"
          else
            echo "INFO: upload step did not succeed (outcome=$OUTCOME) — artifact API may not be available under act"
            echo "PASS: action ran without crashing the workflow"
          fi
