name: Test upload directory with multiple files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with multiple files
        run: |
          mkdir -p /tmp/test-dir-upload
          echo "file one content" > /tmp/test-dir-upload/file1.txt
          echo "file two content" > /tmp/test-dir-upload/file2.txt
          echo "file three content" > /tmp/test-dir-upload/file3.txt

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-directory-artifact
          path: /tmp/test-dir-upload/

      - name: Assert action ran for directory upload
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          echo "artifact-digest: $ARTIFACT_DIGEST"
          # The action must have run (success or failure due to API unavailability)
          if [ "$OUTCOME" = "success" ]; then
            echo "Upload succeeded for directory"
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: artifact-id is empty on success"
              exit 1
            fi
            echo "PASS: directory artifact uploaded successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but upload failed (artifact API not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
