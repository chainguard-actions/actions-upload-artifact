name: Test archive=false option (upload without zipping)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create single test file
        run: |
          mkdir -p /tmp/test-no-archive
          echo "raw file content without archiving" > /tmp/test-no-archive/raw-file.txt

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-no-archive-artifact
          path: /tmp/test-no-archive/raw-file.txt
          archive: 'false'

      - name: Assert action ran with archive=false
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          echo "artifact-digest: $ARTIFACT_DIGEST"
          # The action must have run (success or failure due to API unavailability)
          if [ "$OUTCOME" = "success" ]; then
            echo "Upload succeeded with archive=false"
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: artifact-id is empty on success"
              exit 1
            fi
            echo "PASS: artifact uploaded successfully without archiving"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but upload failed (artifact API not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
