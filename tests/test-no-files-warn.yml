name: Test if-no-files-found warn
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure the path does not exist
        run: |
          rm -rf /tmp/nonexistent-warn-path

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: no-files-warn-artifact
          path: /tmp/nonexistent-warn-path/*.txt
          if-no-files-found: warn

      - name: Assert action did not fail (warn mode should not fail)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: '$ARTIFACT_ID'"
          # When no files are found and if-no-files-found=warn, the action
          # should succeed (not fail) with a warning, outputs should be empty
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail in warn mode when no files are found"
            exit 1
          fi
          if [ -n "$ARTIFACT_ID" ]; then
            echo "FAIL: artifact-id should be empty when no files are found"
            exit 1
          fi
          echo "PASS: action completed without failure in warn mode, outputs are empty"
