name: Test if-no-files-found warn
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: upload
        uses: .
        with:
          name: test-no-files-warn
          path: /tmp/nonexistent-path-that-does-not-exist-xyz/**
          if-no-files-found: warn

      - name: Assert action succeeded with warning (warn mode)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: '$ARTIFACT_ID'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed in warn mode, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action completed without failure in warn mode"
          echo "PASS: artifact-id is empty as expected (no files uploaded)"
