name: Test retention-days input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact file
        run: |
          mkdir -p /tmp/retention-test
          echo "retention days test content" > /tmp/retention-test/output.txt

      - id: upload
        uses: .
        with:
          name: retention-days-artifact
          path: /tmp/retention-test/output.txt
          retention-days: 5

      - name: Assert artifact-id is set
        env:
          ACTUAL: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "actual artifact-id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: artifact-id is empty"
            exit 1
          fi
          echo "PASS: artifact-id is set to $ACTUAL"

      - name: Assert artifact-url is set
        env:
          ACTUAL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "actual artifact-url: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: artifact-url is empty"
            exit 1
          fi
          echo "PASS: artifact-url is set to $ACTUAL"
