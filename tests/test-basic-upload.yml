name: Test basic artifact upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to upload
        run: |
          mkdir -p /tmp/upload-test
          echo "hello artifact" > /tmp/upload-test/hello.txt

      - id: upload
        uses: .
        with:
          name: test-artifact
          path: /tmp/upload-test/hello.txt
        continue-on-error: true

      - name: Assert upload ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: upload succeeded with artifact-id='$ARTIFACT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: upload failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
