name: Test basic artifact upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to upload
        run: |
          mkdir -p /tmp/artifact-test
          echo "hello artifact" > /tmp/artifact-test/hello.txt

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-artifact
          path: /tmp/artifact-test/hello.txt

      - name: Assert action ran (upload succeeded or failed gracefully on sentinel env)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: artifact upload succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in sentinel/act environment without artifact backend)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
