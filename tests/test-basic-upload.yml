name: Test basic artifact upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file to upload
        run: |
          mkdir -p /tmp/upload-test
          echo "hello artifact world" > /tmp/upload-test/hello.txt

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: basic-test-artifact
          path: /tmp/upload-test/hello.txt

      - name: Assert action ran and outputs are consistent
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          echo "artifact-digest: $ARTIFACT_DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: upload succeeded but artifact-id is empty"
              exit 1
            fi
            if [ -z "$ARTIFACT_URL" ]; then
              echo "FAIL: upload succeeded but artifact-url is empty"
              exit 1
            fi
            echo "PASS: artifact uploaded successfully, id=$ARTIFACT_ID"
          else
            echo "INFO: upload step did not succeed (outcome=$OUTCOME) — artifact API may not be available under act"
            echo "PASS: action ran without crashing the workflow"
          fi
