name: Test basic artifact upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to upload
        run: |
          mkdir -p /tmp/upload-test
          echo "hello artifact" > /tmp/upload-test/hello.txt

      - id: upload
        uses: .
        continue-on-error: true
        with:
          name: test-artifact
          path: /tmp/upload-test/hello.txt

      - name: Assert action ran and produced expected outcome
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          echo "artifact-digest: $ARTIFACT_DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: action succeeded but artifact-id is empty"
              exit 1
            fi
            if [ -z "$ARTIFACT_URL" ]; then
              echo "FAIL: action succeeded but artifact-url is empty"
              exit 1
            fi
            echo "PASS: artifact uploaded with id=$ARTIFACT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (artifact service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
