name: Test merge artifacts with separate-directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: merged-artifacts-separated
          pattern: '*'
          separate-directories: 'true'
          include-hidden-files: 'true'
          compression-level: '0'

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          ARTIFACT_ID: ${{ steps.action.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.action.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.action.outputs.artifact-digest }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          echo "artifact-digest: $ARTIFACT_DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACT_ID" ] && [ -z "$ARTIFACT_URL" ]; then
              echo "FAIL: action succeeded but both artifact-id and artifact-url are empty"
              exit 1
            fi
            echo "PASS: got artifact-id='$ARTIFACT_ID' artifact-url='$ARTIFACT_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
