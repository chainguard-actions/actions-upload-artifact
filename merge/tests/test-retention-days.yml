name: Test retention-days input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: merge
        uses: .
        continue-on-error: true
        with:
          name: merged-artifacts-retention
          pattern: '*'
          retention-days: 5

      - name: Assert action ran with retention-days input
        env:
          OUTCOME: ${{ steps.merge.outcome }}
          ARTIFACT_ID: ${{ steps.merge.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.merge.outputs.artifact-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact-id: $ARTIFACT_ID"
          echo "artifact-url: $ARTIFACT_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACT_ID" ]; then
              echo "FAIL: action succeeded but artifact-id is empty"
              exit 1
            fi
            echo "PASS: artifact-id='$ARTIFACT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or no artifacts to merge)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
